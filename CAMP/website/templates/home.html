{% extends "base.html" %}
<!-- Extends the "base.html" template to inherit common layout and structure -->

{% block title %}Home{% endblock %}
<!-- Defines the title of the page as "Home" -->

{% block content %}
<!-- Defines the 'content' block where page-specific content is added -->

<html style="height: 100%;">
<!-- Setting the height of the HTML element to 100% for full-page layout -->

<head>
    <style>
        /* Style for the logo inside the container */
        .camp-logo {
            position: absolute; /* Positions the logo relative to the viewport */
            top: 30%; /* Set distance from the top of the page */
            right: 445px; /* Center align horizontally */
            transform: translateX(-50%); /* Adjust to perfectly center the logo */
            width: 110px; /* Define logo width */
            height: auto; /* Keeps aspect ratio intact */
            z-index: 10; /* Ensures the logo is on top of other elements */
    }

         /* Style for the top-left logo */
         .top-left-logo {
            position: absolute; /* Position the logo relative to the viewport */
            top: 0; /* Align at the very top */
            left: 0; /* Align at the very left */
            height: 100%; /* Fit the full height of the viewport */
            width: auto; /* Maintain the aspect ratio by adjusting the width automatically */
            margin: 0; /* Remove any extra space around the logo */
            overflow: hidden; /* Prevent scrollbars */
    }

        /* Apply these styles to the entire HTML and BODY elements */
        html, body {
            height: 100%; /* Occupies the full height of the viewport */
            margin: 0; /* Removes default margin */
            overflow: hidden; /* Prevent scrollbars from appearing */
            background-image:
            url('static/image.png'), /* Sets the topmost background image */
            url('static/Group.svg'); /* Sets the secondary background image behind it */
            background-size: cover; /* Scales images individually: cover fills topmost, contain keeps aspect ratio */
            background-repeat: no-repeat, no-repeat; /* Prevents the images from repeating/tiling */
            background-position: center, center; /* Centers both background images */
        }

        /* Styles for the container holding the heading and buttons */
        .positioned-div {
            top: 40%; /* Positions the div 40% from the top of the viewport */
            right: 23%; /* Positions the div 23% from the right side */
            position: absolute; /* Allows precise positioning within the viewport/container */

            background-color: rgba(255, 250, 250, 0.37); /* Semi-transparent white background for visual contrast */
            padding: 20px; /* Adds space inside the div between its content and borders */
            border-radius: 10px; /* Rounds the corners for a cleaner UI */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Adds a subtle shadow for a floating effect */
        }

        /* Styles for the "Select your role" text */
        h4 {
            color: white; /* Sets the text color to white */
            margin-bottom: 1rem; /* Adds spacing below the heading */
        }

        /* Styles for buttons */
        .custom-btn {
            font-weight: bold; /* Makes the button text bold */
            width: 110px; /* Sets a fixed width for the buttons */
            background-color: white; /* Sets the button background color to white */
            color: #7b1818; /* Sets the text color to a dark red shade */
        }

        /* Adds spacing between consecutive buttons */
        .custom-btn + .custom-btn {
            margin-top: 0.75rem; /* Adds a margin of 0.75rem between stacked buttons */
        }
    </style>
</head>

<body>
    <!-- Add the SVG logo at the top-left of the page -->
    <img src="static/CAMP.svg" alt="CAMP Logo" class="top-left-logo"/>


<!-- CAMP Logo -->
        <img src="{{ url_for('static', filename='camp_logo.png') }}" alt="CAMP Logo" class="camp-logo"/>
    <!-- Main content begins -->
    <div class="d-flex flex-column align-items-center positioned-div">
        <!-- A div container centered and styled using custom and Bootstrap classes -->
        <!-- d-flex: Enables Flexbox -->
        <!-- flex-column: Stacks child elements vertically -->
        <!-- align-items-center: Centers child elements horizontally -->

        <h4>Select your role</h4>
        <!-- Heading displaying the instruction to select a role -->

        <!-- Buttons to navigate to specific role login pages -->
        <a href="/adminlogin" class="btn custom-btn text-center" role="button" aria-pressed="true">Admin</a>
        <!-- Button linking to Admin login page -->
        <a href="/facultylogin" class="btn custom-btn text-center" role="button" aria-pressed="true">Faculty</a>
        <!-- Button linking to Faculty login page -->
        <a href="/studentlogin" class="btn custom-btn text-center" role="button" aria-pressed="true">Student</a>
        <!-- Button linking to Student login page -->
    </div>
    <!-- End of the container div -->
</body>

{% endblock %}
<!-- End of the content block -->
