{% extends "Admin/adminNavbarFaculty.html" %} <!-- Extends the base template for faculty admin navigation bar. -->

{% block title %}Admin Add Faculty{% endblock %}

{% block content %} <!-- Content block to include content specific to this page. -->
<style>
    body {
        background-color: #d9d9d9; /* Sets the background color of the page to light gray. */
        padding-top: 80px ;/* Moves the content 80px downwards. */
    }

    h2 {
        font-size: 2rem; /* Defines the font size for the heading. */
        font-weight: bolder; /* Makes the text bold. */
        color: #8d0404; /* Sets the text color to dark red. */
        background-color: #d9d9d9; /* Background color for the heading matching the body. */
        height: 50px; /* Sets a fixed height for the heading. */
        margin-bottom: 0; /* Removes default bottom margin. */
    }

    .container {
        height: auto; /* Allows the container to adjust height based on its content. */
        width: 100%; /* Sets the container width to take up the entire available space. */
        max-width: 1200px; /* Restricts the maximum width to 1200px for better readability. */
        margin: 0 auto; /* Centers the container horizontally. */
        padding: 0; /* Resets padding of the container. */
        font-family: Lexend Deca, sans-serif; /* Sets font style for the container. */
        background-color: #8d0404; /* Sets the background color to dark red. */
    }

    h6 {
        font-size: 1.2rem; /* Slightly larger font size for subheadings. */
        color: white; /* Sets the text color to white for better contrast. */
        font-weight: normal; /* Resets font weight to normal for readability. */
        text-align: left; /* Aligns the text to the left. */
        padding-top: 10px; /* Adds padding to the top of the subheading. */
        margin-left: 10px; /* Adds a small left margin for positioning. */
    }

    form {
        height: auto; /* Lets the form height adjust based on its content. */
        padding: 20px 50px; /* Adds spacing inside the form. */
        background-color: #f8f9fa; /* Sets a light gray background color for the form. */
        color: #8d0404; /* Sets text color to dark red. */
    }

    .form-row {
        display: flex; /* Aligns elements inside the form row horizontally. */
        justify-content: space-between; /* Distributes the space evenly between columns. */
        gap: 20px; /* Adds spacing between the columns. */
    }

    .form-column {
        flex: 1; /* Equalizes the width of the columns. */
        display: flex; /* Aligns elements within the column using flexbox. */
        flex-direction: column; /* Arranges the column elements vertically. */
    }

    .form-group {
        display: flex; /* Aligns label and input field using flexbox. */
        flex-direction: column; /* Vertically stacks elements (label followed by input). */
        margin-bottom: 15px; /* Adds spacing between form groups. */
    }

    label {
        margin-bottom: 5px; /* Adds spacing below the label. */
        font-size: 14px; /* Sets font size for labels. */
        font-weight: bold; /* Emphasizes labels with bold text. */
    }

    input {
        width: 70%; /* Restricts the width of input fields. */
        padding: 8px; /* Adds padding inside the input fields. */
        border: 1px solid #ccc; /* Sets a gray border for input fields. */
        font-size: 14px; /* Sets font size for input text. */
        color: #8d0404; /* Sets text color inside the input to dark red. */
        line-height: 1.2; /* Sets line-height to control vertical spacing inside inputs. */
    }

    input:focus, select:focus, textarea:focus {
        border-color: #8d0404; /* Changes border color to dark red on focus. */
        outline: #8d0404; /* Removes default outline color and matches it to dark red. */
        box-shadow: 0 0 3px rgba(255, 0, 43, 0.8); /* Adds a subtle red shadow for focus indication. */
    }

    small {
        color: #dc3545; /* Sets the text color for helper/error messages to red. */
        font-size: 12px; /* Reduces the font size for small messages. */
    }

    .buttons {
        display: flex; /* Aligns buttons using flexbox. */
        justify-content: flex-end; /* Positions buttons to the right edge. */
        gap: 10px; /* Spaces out buttons if more than one exists. */
    }

    .btn-primary {
        font-size: 14px; /* Sets font size for primary buttons. */
        background-color: #8d0404; /* Sets button background to dark red. */
        color: #fff; /* Makes button text white for contrast. */
        padding: 8px 16px; /* Adds padding for click area. */
        border: none; /* Removes the default borders. */
        border-radius: 4px; /* Rounds the button corners slightly. */
    }

    .btn-primary:hover {
        background-color: #fff; /* Reverses background to white on hover. */
        color: #8d0404; /* Makes the button text dark red on hover. */
        border: 1px solid #8d0404; /* Adds a border for hover effect. */
    }

    .btn2 {
        background-color: #8d0404; /* Sets a dark red background for the 'close' button. */
        color: #fff; /* Makes 'close' button text white. */
        border: none; /* Removes the button border. */
        float: right; /* Aligns the button to the right side. */
        margin-top: 0; /* Removes top margin. */
        margin-right: 20px; /* Adds some space from the container edge. */
        padding: 8px 16px; /* Adds padding for better usability. */
    }

    .btn2:hover {
        color: white; /* Keeps the text color white on hover. */
        text-decoration: none; /* Removes underline on hover. */
    }

    .buttons {
        padding-top: 40px; /* Adds space above buttons. */
        padding-bottom: 40px; /* Adds space below buttons. */
        padding-left: 0 !important; /* Overrides any padding on the left with 0. */
        margin-left: 1036px; /* Offsets buttons by providing a left margin. */
        position: absolute; /* Sets an absolute position for buttons. */
    }

        /* Notification styling */
        .notification {
        position: fixed; /* Fix the position */
        top: 10px; /* Set top position */
        right: 10px; /* Set right position */
        background-color: #28a745; /* Green background for success */
        color: white; /* White text color */
        padding: 15px; /* Add padding */
        border-radius: 5px; /* Round the corners */
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2); /* Add shadow */
        font-size: 14px; /* Set font size */
        z-index: 1000; /* Ensure it appears above other content */
        opacity: 1; /* Set opacity */
        transition: opacity 0.5s ease; /* Smooth transition for opacity */
    }

</style>

<body>
<div class="title">
    <h2>ADD FACULTY</h2> <!-- Title heading for the Add Faculty page. -->
</div>
<a href="{{ url_for('admin.view_faculty') }}" class="btn2">x</a> <!-- Close button redirects to 'admin.view_faculty' page. -->

<div class="container">
    <h6>FACULTY DETAILS</h6> <!-- Section heading indicating where to input faculty details. -->
    <form method="POST" onsubmit="return validateFormFaculty()"> <!-- Form submission via POST with a JavaScript validation. -->
        <div class="form-row">
            <!-- Left Column -->
            <div class="form-column">
                <div class="form-group">
                    <label for="first_name">First Name:</label> <!-- Label for the First Name field. -->
                    <input type="text" id="first_name" name="first_name" required> <!-- Input field for First Name (required). -->
                </div>

                <div class="form-group">
                    <label for="middle_name">Middle Name:</label> <!-- Label for Middle Name. -->
                    <input type="text" id="middle_name" name="middle_name"> <!-- Input field for Middle Name (optional). -->
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name:</label> <!-- Label for Last Name. -->
                    <input type="text" id="last_name" name="last_name" required> <!-- Input field for Last Name (required). -->
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" 
                           pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" 
                           title="Please enter a valid email address" required>
                </div>
            </div>

            <!-- Right Column -->
            <div class="form-column">
                <div class="form-group">
                    <label for="phone_number">Phone Number:</label>
                    <input type="text" id="phone_number" name="phone_number" maxlength="11" 
                           pattern="\d{11}" title="Phone number must be exactly 11 digits" required>
                </div>

                <div class="form-group">
                    <label for="username">Username:</label> <!-- Label for Username. -->
                    <input type="text" id="username" name="username" required maxlength="50"> <!-- Input field for Username with a max length of 50 characters (required). -->
                </div>

                <div class="form-group">
                    <label for="password">Password:</label> <!-- Label for Password. -->
                    <input type="password" id="password" name="password" required maxlength="10"> <!-- Input field for Password with a max length of 10 characters (required). -->
                </div>
            </div>
        </div>

        <div class="buttons">
            <button type="submit" class="btn-primary">Add Faculty</button> <!-- Submit button to add faculty details. -->
        </div>
    </form>
</div>
</body>

<script>
    function validateFormFaculty() {
        const phoneNumber = document.getElementById("phone_number").value;
        const email = document.getElementById("email").value;

        // Validate phone number (must be exactly 11 digits)
        if (phoneNumber && !/^\d{11}$/.test(phoneNumber)) {
            alert("Phone number must be exactly 11 digits.");
            return false;
        }

        // Validate email format
        const emailPattern = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;
        if (email && !emailPattern.test(email)) {
            alert("Please enter a valid email address.");
            return false;
        }

        return true; // Allow form submission if all validations pass
    }

    // Limit phone number input to 11 digits
    document.getElementById("phone_number").addEventListener("input", function (event) {
        const input = event.target;
        input.value = input.value.replace(/\D/g, ""); // Remove non-numeric characters
        if (input.value.length > 11) {
            input.value = input.value.slice(0, 11); // Limit to 11 digits
        }
    });
</script>

<script>
    // Function to show a success notification
    function showSuccessNotification(message) {
        const notification = document.createElement('div'); // Create a new div for the notification
        notification.className = 'notification'; // Add the notification class
        notification.textContent = message; // Set the notification message
        document.body.appendChild(notification); // Append the notification to the body

        // Automatically remove the notification after 5 seconds
        setTimeout(() => {
            notification.remove(); // Remove the notification
        }, 5000);
    }

    // Call this function after successful form submission
    async function handleFormSubmission(event) {
        event.preventDefault(); // Prevent the default form submission

        if (validateFormFaculty()) {
            showSuccessNotification('Faculty member has been added successfully!');

            // Simulate form submission via AJAX (or use fetch/axios for real submission)
            const formData = new FormData(event.target); // Collect form data
            const response = await fetch(event.target.action, {
                method: event.target.method,
                body: formData,
            });

            if (response.ok) {
                // Redirect after showing the success message
                setTimeout(() => {
                    window.location.reload(); // Reload the page or redirect to another page
                }, 5000); // Delay the redirect to allow the notification to stay visible
            } else {
                alert('An error occurred while adding the faculty member. Please try again.');
            }
        }
    }

    // Attach the form submission handler
    document.querySelector('form').addEventListener('submit', handleFormSubmission);
</script>

{% endblock %} <!-- Marks the end of the content block. -->
